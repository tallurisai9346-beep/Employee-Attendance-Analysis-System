{% extends "base.html" %}{% block title %}Change password{% endblock %}{% block breadcrumb %}Change password{% endblock %}
{% block content %}<div class="page-heading"><div><span class="eyebrow">ACCOUNT SECURITY</span><h1>Change password</h1><p>Choose a strong password of at least 8 characters.</p></div></div><section class="panel form-panel"><form method="post" class="form-stack narrow-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Current password<input type="password" name="current_password" autocomplete="current-password" required></label><label>New password<input type="password" name="new_password" minlength="8" autocomplete="new-password" required></label><label>Confirm new password<input type="password" name="confirm_password" minlength="8" autocomplete="new-password" required></label><button class="btn primary" type="submit">Update password</button></form></section>{% endblock %}
